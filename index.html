.hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,30,.84) 0%,rgba(10,14,30,.52) 50%,rgba(10,14,30,.86) 100%)}
.hero-inner{position:relative;z-index:2;text-align:center;padding:38px 20px 44px;color:#FFF9EF;max-width:920px}
.hero .logo{display:block;width:132px;height:auto;margin:0 auto 16px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.55))}
.kicker{display:inline-flex;align-items:center;gap:14px;font-family:var(--disp);font-size:17px;letter-spacing:.16em;color:#F5C88A;text-transform:uppercase;margin-bottom:12px}
.kicker::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--red)}
.hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(34px,5.4vw,58px);line-height:1.22;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:#F5C88A}
.hero .lede{margin-top:12px;font-size:clamp(16px,2.2vw,20px);color:rgba(255,249,239,.88)}
.hero .sub{margin-top:20px;display:inline-block;font-family:var(--serif);font-weight:700;font-size:17px;color:#FFF9EF;border:1.5px solid rgba(255,249,239,.5);border-radius:999px;padding:8px 22px}

main{max-width:920px;margin:0 auto;padding:36px 22px 40px}
.view{display:none}
.view.active{display:block;animation:rise .45s cubic-bezier(.16,.8,.3,1) both}

/* === 首页：套题选择 === */
.section-title{font-family:var(--serif);font-weight:900;font-size:clamp(22px,3vw,30px);margin-bottom:6px}
.section-sub{color:var(--ink-soft);font-size:16px;margin-bottom:24px}
.sets{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.setcard{background:var(--card);border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:24px 26px;text-align:left;cursor:pointer;transition:all .2s ease;position:relative;overflow:hidden}
.setcard:hover{transform:translateY(-3px);border-color:var(--red)}
.setcard:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.setcard::after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--red)}
.setcard.s2::after{background:var(--blue)} .setcard.s3::after{background:var(--gold)} .setcard.s4::after{background:var(--green)}
.setcard .sn{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--red);letter-spacing:.08em}
.setcard.s2 .sn{color:var(--blue)} .setcard.s3 .sn{color:var(--gold)} .setcard.s4 .sn{color:var(--green)}
.setcard h3{font-family:var(--serif);font-weight:900;font-size:24px;margin:6px 0 8px}
.setcard p{color:var(--ink-soft);font-size:15px}
.setcard .go{margin-top:16px;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--ink)}
.setcard .go span{color:var(--red);font-size:20px}

/* === 答题 === */
.bar{display:flex;align-items:center;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.bar .label{font-family:var(--disp);font-weight:600;font-size:18px;color:var(--ink);white-space:nowrap}
.bar .label b{color:var(--red)}
.track{flex:1;min-width:140px;height:9px;border-radius:6px;background:var(--paper-2);border:1px solid var(--line);overflow:hidden}
.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--blue));transition:width .4s ease}
.score{font-family:var(--disp);font-weight:600;font-size:18px;color:var(--blue);white-space:nowrap}
.q-card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:34px 38px 30px}
.q-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.q-num{font-family:var(--disp);font-weight:700;font-size:15px;color:#fff;background:var(--ink);border-radius:999px;padding:6px 15px;letter-spacing:.05em}
.q-tag{font-size:14px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:6px 16px}
.q-title{font-family:var(--serif);font-weight:700;font-size:clamp(20px,3vw,28px);line-height:1.55;margin-bottom:24px}
.opts{display:grid;gap:13px}
.opt{display:flex;align-items:flex-start;gap:15px;width:100%;text-align:left;font-family:var(--sans);font-size:clamp(16px,2.2vw,19px);font-weight:500;color:var(--ink);
  background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:15px 19px;cursor:pointer;transition:all .18s ease;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-soft);transform:translateY(-1px)}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt .key{flex:none;width:32px;height:32px;border-radius:9px;background:var(--paper-2);color:var(--ink-soft);font-family:var(--disp);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .18s ease}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.correct .key{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .key{background:var(--red);color:#fff}
.opt:disabled{cursor:default}
.feedback{margin-top:22px;border-radius:14px;padding:16px 20px;font-size:16px;display:none;animation:rise .45s cubic-bezier(.16,.8,.3,1) both}
.feedback.show{display:block}
.feedback.ok{background:var(--green-soft);border-left:5px solid var(--green)}
.feedback.no{background:var(--red-soft);border-left:5px solid var(--red)}
.feedback .verdict{font-family:var(--serif);font-weight:900;font-size:19px;margin-bottom:4px}
.feedback.ok .verdict{color:var(--green)} .feedback.no .verdict{color:var(--red)}
.feedback .exp{color:var(--ink);line-height:1.7}
.actions{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{font-family:var(--sans);font-size:16px;font-weight:700;border:none;border-radius:12px;padding:13px 26px;cursor:pointer;transition:all .18s ease}
.btn.primary{background:var(--red);color:#fff;box-shadow:0 10px 22px -12px var(--red)}
.btn.primary:hover{background:#cf3a24;transform:translateY(-1px)}
.btn.ghost{background:var(--paper-2);color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn[hidden]{display:none}

/* === 结果 === */
.result{background:var(--card);border:1.5px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:40px 38px;text-align:center}
.badge{display:inline-block;font-family:var(--serif);font-weight:900;font-size:18px;border-radius:999px;padding:8px 26px;margin-bottom:10px}
.badge.pass{background:var(--green-soft);color:var(--green)}
.badge.fail{background:var(--gold-soft);color:#A86E00}
.result h2{font-family:var(--serif);font-weight:900;font-size:32px;margin:6px 0}
.result .bigscore{font-family:var(--disp);font-weight:700;font-size:50px;color:var(--red)}
.result .bigscore small{font-size:20px;color:var(--ink-soft);font-weight:600}
.result .quote{margin:18px auto 24px;max-width:640px;font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.7;color:var(--ink);background:var(--gold-soft);border-radius:14px;padding:18px 22px}

/* === 答案一览 === */
.keybox{margin-top:28px;background:var(--paper-2);border:1.5px solid var(--line);border-radius:20px;overflow:hidden}
.keybox>summary{cursor:pointer;list-style:none;padding:18px 24px;font-family:var(--serif);font-weight:700;font-size:19px;display:flex;align-items:center;gap:12px}
.keybox>summary::-webkit-details-marker{display:none}
.keybox>summary::before{content:"+";font-family:var(--disp);font-size:26px;color:var(--red);line-height:1}
.keybox[open]>summary::before{content:"−"}
.kbody{padding:0 24px 22px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tab{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.klist{display:none}
.klist.on{display:block}
.ki{padding:14px 0;border-top:1px solid var(--line);font-size:15px}
.ki .qt{font-weight:700;margin-bottom:4px}
.ki .qa{color:var(--green);font-weight:700}
.ki .qa span{color:var(--ink-soft);font-weight:500}
.ki .qo{color:var(--ink-soft);font-size:14px;margin-top:3px}

footer{background:#121831;color:rgba(255,249,239,.8)}
.finner{max-width:920px;margin:0 auto;padding:26px 22px;display:flex;align-items:center;gap:18px;justify-content:center;text-align:left}
.finner img{width:46px;height:auto;flex:none}
.finner .ft{font-size:13.5px;line-height:1.8}
.finner b{display:block;color:#F5C88A;font-size:15px;margin-bottom:2px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:620px){
  .hero{min-height:320px}
  .sets{grid-template-columns:1fr}
  .q-card,.result{padding:24px 20px}
  .opt{padding:13px 15px}
  .actions .btn{flex:1;text-align:center}
  .finner{flex-direction:column;text-align:center}
}
</style>
</head>
<body>

<header class="hero">

     opts:["竞争与淘汰","接纳、平等和尊重","只看重比赛成绩","让少数人受益"], a:1,
     exp:"特奥通过各类项目，推动社会构建接纳、平等和尊重的氛围。"},
    {cat:"核心宗旨", q:"按照特奥的使命，运动员在参与中可以与他人分享什么？",
     opts:["奖金","快乐、技艺与友谊","奖牌","世界排名"], a:1,
     exp:"使命强调在参与中与其他运动员、家人和公众分享快乐、交流技艺并增进友谊。"},
    {cat:"社会意义", q:"资料中的一句话这样形容特奥运动员：“他们都是各自生活中的____”。",
     opts:["冠军","英雄","明星","强者"], a:1,
     exp:"资料写道，特奥运动员都是各自生活中的英雄。"},
    {cat:"社会意义", q:"下列哪一位不是特奥全球形象大使？",
     opts:["姚明","李娜","李连杰","杨澜"], a:2,
     exp:"资料列出的全球形象大使包括姚明、李娜、杨澜、邹市明、周迅、杨扬、周冠宇、苏翊鸣等，李连杰不在其中。"},
    {cat:"基本概念", q:"谁是特殊奥林匹克的创始人？",
     opts:["蒂姆·施莱佛","尤尼斯·肯尼迪·施莱佛","姚明","顾拜旦"], a:1,
     exp:"尤尼斯·肯尼迪·施莱佛是特奥创始人及名誉主席，长期领导这场全球运动。"}
  ]}
];

const L = ["A","B","C","D"];
let setIdx = 0, idx = 0, score = 0, locked = false;
const $ = id => document.getElementById(id);
const view = id => {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo({top:0,behavior:'instant'});
};

function home(){
  view('v-home');
  const box = $('sets'); box.innerHTML = '';
  SETS.forEach((s,i)=>{
    const b = document.createElement('button');
    b.className = 'setcard s'+(i+1); b.type='button';
    b.innerHTML = '<div class="sn">SET '+(i+1)+'</div><h3>'+s.name+'</h3><p>'+s.desc+' · 共 5 题</p><div class="go">开始答题 <span>→</span></div>';
    b.addEventListener('click',()=>start(i));
    box.appendChild(b);
  });
}

function start(i){ setIdx=i; idx=0; score=0; view('v-quiz'); render(); }

function render(){
  const item = SETS[setIdx].qs[idx];
  locked = false;
  $('cur').textContent = idx+1;
  $('fill').style.width = (idx/5*100)+'%';
  $('score').textContent = score;
  $('qnum').textContent = 'Q'+(idx+1);
  $('qtag').textContent = item.cat;
  $('qtitle').textContent = item.q;
  const box=$('opts'); box.innerHTML='';
  item.opts.forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='opt'; b.type='button';
    b.innerHTML='<span class="key">'+L[i]+'</span><span>'+t+'</span>';
    b.addEventListener('click',()=>answer(i,b));
    box.appendChild(b);
  });
  $('feedback').className='feedback';
  $('next').hidden=true;
}

function answer(c,btn){
  if(locked) return; locked=true;
  const item=SETS[setIdx].qs[idx], right=item.a, all=$('opts').children;
  for(let i=0;i<all.length;i++) all[i].disabled=true;
  if(c===right){ score++; btn.classList.add('correct'); }
  else { btn.classList.add('wrong'); all[right].classList.add('correct'); }
  $('score').textContent=score;
  const fb=$('feedback');
  fb.className='feedback show '+(c===right?'ok':'no');
  $('verdict').textContent = c===right?'回答正确':'再想想～';
  $('exp').innerHTML = (c===right?'':'正确答案是 '+L[right]+'。')+item.exp;
  $('next').hidden=false;
  $('next').textContent = (idx===4)?'查看结果 →':'下一题 →';
  $('next').focus();
}

function next(){ if(idx<4){ idx++; render(); } else result(); }

function encouraging(s){
  if(s===5) return '全对！你对特奥的了解非常出色，是名副其实的特奥小专家！';
  if(s===4) return '非常棒！只差一点点就满分，你的特奥知识令人印象深刻！';
  if(s===3) return '合格！你已经掌握了特奥的核心知识，为你的勇敢尝试点赞！';
  if(s===2) return '差一点就合格啦！再看一遍解析，再来一次，你一定可以——这正是特奥精神。';
  if(s===1) return '每一次了解都值得肯定。看看答案一览，再挑战一次，进步就在眼前。';
  return '没关系，勇敢尝试本身就是胜利。建议先看看答案解析，再重新挑战！';
}

function result(){
  view('v-result');
  $('fill').style.width='100%';
  $('finalScore').textContent=score;
  const pass = score>=3;
  $('badge').className='badge '+(pass?'pass':'fail');
  $('badge').textContent = pass?'合格 ✓':'继续加油';
  $('resultTitle').textContent = SETS[setIdx].name+' · 答题完成';
  $('finalQuote').textContent = encouraging(score);
  const kb=$('resultKey'); kb.innerHTML='';
  SETS[setIdx].qs.forEach((it,i)=>{
    const d=document.createElement('div'); d.className='ki';
    d.innerHTML='<div class="qt">'+(i+1)+'. ['+it.cat+'] '+it.q+'</div>'+
      '<div class="qo">'+it.opts.map((o,j)=>L[j]+'. '+o).join('　')+'</div>'+
      '<div class="qa">正确答案：'+L[it.a]+'　<span>'+it.exp+'</span></div>';
    kb.appendChild(d);
  });
  $('keybox2').open=false;
}

function buildKey(){
  const tabs=$('tabs'), lists=$('keylists'); tabs.innerHTML=''; lists.innerHTML='';
  SETS.forEach((s,si)=>{
    const t=document.createElement('button');
    t.className='tab'+(si===0?' on':''); t.type='button'; t.textContent='第'+(si+1)+'套';
    t.addEventListener('click',()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
      document.querySelectorAll('.klist').forEach(x=>x.classList.remove('on'));
      t.classList.add('on'); $('kl'+si).classList.add('on');
    });
    tabs.appendChild(t);
    const wrap=document.createElement('div');
    wrap.className='klist'+(si===0?' on':''); wrap.id='kl'+si;
    s.qs.forEach((it,i)=>{
      const d=document.createElement('div'); d.className='ki';
      d.innerHTML='<div class="qt">'+(si+1)+'.'+(i+1)+' ['+it.cat+'] '+it.q+'</div>'+
        '<div class="qo">'+it.opts.map((o,j)=>L[j]+'. '+o).join('　')+'</div>'+
        '<div class="qa">正确答案：'+L[it.a]+'　<span>'+it.exp+'</span></div>';
      wrap.appendChild(d);
    });
    lists.appendChild(wrap);
  });
}

document.addEventListener('keydown',e=>{
  if(!$('v-quiz').classList.contains('active')) return;
  if(!locked && /^[1-4]$/.test(e.key)){ const b=$('opts').children[+e.key-1]; if(b) b.click(); }
  else if(!locked && /^[a-d]$/i.test(e.key)){ const b=$('opts').children[L.indexOf(e.key.toUpperCase())]; if(b) b.click(); }
  else if(locked && (e.key==='Enter'||e.key==='ArrowRight')) next();
});

$('next').addEventListener('click',next);
$('backhome').addEventListener('click',home);
$('retry').addEventListener('click',()=>start(setIdx));
$('choose').addEventListener('click',home);
buildKey(); home();
</script>
</body>
</html>
